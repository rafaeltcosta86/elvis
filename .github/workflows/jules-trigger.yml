name: Acionar Jules

on:
  issues:
    types: [opened, labeled]

jobs:
  trigger-jules-on-spec-approved:
    name: spec:aprovado → acionar Jules para implementação
    if: github.event.label.name == 'spec:aprovado'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Adicionar label jules e comentar para acionar o agente
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;

            // 1. Adicionar label jules para acionar o GitHub App do Jules
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['jules'],
            });

            // 2. Mover card para Desenvolvimento
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'stage:aprovacao',
              });
            } catch {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['stage:desenvolvimento'],
            });

            // 3. Postar o comentário com as instruções detalhadas
            const body = [
              '@google-labs-jules A spec desta issue foi aprovada. Por favor, implemente conforme descrito no body acima.',
              '',
              '**Passos obrigatórios antes de começar:**',
              '1. `git fetch origin && git checkout main && git pull` — sempre partir do HEAD atual de main',
              '2. Ler `AGENTS.md` — instruções completas para agentes neste repositório',
              '3. Ler `docs/architecture.md` — invariantes de ouro e Definition of Done',
              '',
              '**Sequência obrigatória após implementar:**',
              '- Rodar `pnpm --filter api exec vitest run` — confirmar que os testes passam (green bar)',
              '- Abrir PR com `Closes #' + issueNumber + '` no corpo — o board e os agentes de QA são acionados automaticamente',
              '- Se o QA Agent reprovar (label `qa:needs-work` no PR): leia o comment com os ACs não cobertos, corrija e faça push',
              '',
              '**Regras de implementação:**',
              '- Implementar apenas o que os Acceptance Criteria descrevem — não ir além do escopo',
              `- Incluir \`Closes #${issueNumber}\` no corpo do PR`,
              '- Não commitar direto em main — criar branch descritiva a partir de main',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  trigger-jules:
    name: Notificar Jules sobre violação de arquitetura
    if: contains(github.event.issue.labels.*.name, 'architecture-violation')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comentar na issue acionando Jules
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;

            const body = [
              '@google-labs-jules Por favor, corrija a violação de arquitetura descrita nesta issue.',
              '',
              '**Passos obrigatórios antes de começar:**',
              '1. `git fetch origin && git checkout main && git pull` — sempre partir do HEAD atual de main',
              '2. Ler `AGENTS.md` — instruções completas para agentes neste repositório',
              '3. Ler `docs/architecture.md` — invariantes de ouro e Definition of Done',
              '',
              '**Regras de implementação:**',
              '- Corrigir apenas o que a violação aponta — não refatorar código não relacionado',
              '- Rodar `pnpm --filter api exec vitest run` antes de criar o PR',
              `- Incluir \`Closes #${issueNumber}\` no corpo do PR`,
              '- Não commitar direto em main — criar branch descritiva',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
